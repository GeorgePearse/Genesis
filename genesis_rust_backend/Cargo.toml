[package]
name = "genesis_rust_backend"
version = "0.1.0"
edition = "2021"
description = "Rust backend implementation scaffold for Genesis"
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tempfile = "3"

[dev-dependencies]
pretty_assertions = "1"
