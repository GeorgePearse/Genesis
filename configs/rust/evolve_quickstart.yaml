# The evolution loop on its own.
#   genesis evolve examples/circle_packing_rs --config configs/rust/evolve_quickstart.yaml

evo:
  num_generations: 40
  max_evaluation_jobs: 4
  llm_models: [claude-sonnet-5-5, claude-haiku-5-5]
  llm_dynamic_selection: ucb
  patch_types: [diff, full, cross]
  patch_type_probs: [0.6, 0.3, 0.1]
  max_api_costs: 3.0
  meta_llm_models: [claude-haiku-5-5]
  meta_rec_interval: 10
  novelty_llm_models: [claude-haiku-5-5]
  code_embed_sim_threshold: 0.99

db:
  num_islands: 2
  archive_size: 40
  migration_interval: 10
  migration_rate: 0.1
