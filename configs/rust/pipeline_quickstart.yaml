# A small end-to-end run of the science pipeline.
#   genesis run examples/circle_packing_rs --config configs/rust/pipeline_quickstart.yaml
# Any key can be overridden on the command line: `key=value` after the task directory.

models: [claude-sonnet-5-5, claude-haiku-5-5]
budget_usd: 5.0

investigation:
  engine: hybrid            # hybrid | evolve | scientist
  evolution:
    num_generations: 20
    max_evaluation_jobs: 4
    meta_llm_models: [claude-haiku-5-5]
    meta_rec_interval: 8
  database:
    num_islands: 2
    archive_size: 20
  conclusions_interval: 5

ablations:
  max_ablations: 2
  max_extra_baselines: 1
  num_replications: 3

final_evaluation:
  num_replications: 3

posthoc:
  max_selected_analyses: 2

paper:
  max_repair_rounds: 3
